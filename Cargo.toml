[workspace]
resolver = "2"
members = [
    "phorc",
    "phost",
    "phorport",
    "phost_kernel",
]
# `phost_kernel` is a no_std staticlib cross-compiled for
# x86_64-unknown-none via its own .cargo/config.toml and build_kernel.sh.
# It cannot be built for the host (its panic_handler collides with std's),
# so plain `cargo build` / `cargo test` only build the host crates.
# Build the kernel with: cd phost_kernel && ./build_kernel.sh
default-members = ["phorc", "phost", "phorport"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
