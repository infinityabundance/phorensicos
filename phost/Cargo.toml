[package]
name = "phost"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["std"]
# "alloc" — no_std + allocator: enables the runtime modules (canvas, console,
# compositor, nucleus, drivers, status_screen, input, presentation, shell)
# that need allocation but not filesystem/process access.
alloc = ["sha2", "hex"]
# "std" — full host runtime: everything above plus loader/phorc_bridge
# filesystem access. Implies alloc.
std = ["alloc"]

[dependencies]
# force-soft: pure software SHA-256, no runtime CPU-feature detection —
# required for x86_64-unknown-none (kernel) where cpufeatures can't work.
sha2 = { version = "0.10", optional = true, default-features = false, features = ["force-soft"] }
hex = { version = "0.4", optional = true, default-features = false, features = ["alloc"] }
