name: phorensicos

# Two minimal, isolated services:
#   host   — compiler + runtime tests and the JIT-Porting Court verifier
#   kernel — build the no_std kernel, boot it in QEMU, verify boot evidence
#
# Usage:
#   docker compose run --rm host
#   docker compose run --rm kernel
#   docker compose up --build            # both, one shot
#
# Each service is resource-capped to keep the environments minimal.

services:
  host:
    build:
      context: .
      dockerfile: docker/Dockerfile.host
    image: phorensicos/host:local
    command: ["bash", "-c", "./scripts/ci_host.sh"]
    cpus: 2
    mem_limit: 2g
    environment:
      # Deterministic C locale: the toupper court observes libc in the C locale.
      LC_ALL: C

  kernel:
    build:
      context: .
      dockerfile: docker/Dockerfile.kernel
    image: phorensicos/kernel:local
    command: ["bash", "-c", "./scripts/ci_kernel.sh"]
    cpus: 2
    mem_limit: 2g
    environment:
      LC_ALL: C
      # Override the QEMU binary/seconds if needed:
      # QEMU_BIN: qemu-system-x86_64
      # QEMU_SECONDS: "8"
