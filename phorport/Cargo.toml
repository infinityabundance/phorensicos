[package]
name = "phorport"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Host-only autonomous porting foundry: differential exploration orchestration and evidence coordination."

[dependencies]
phost = { path = "../phost" }
gemel = "=0.11.1"
hex = "0.4"
sha2 = "0.10"
# Process controls for the untrusted-candidate worker (rlimits, no_new_privs).
libc = "0.2"
frf = "=0.1.86"

[[bin]]
name = "phorport"
path = "src/bin/phorport.rs"
