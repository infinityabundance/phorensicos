# Phorensic OS — public CI
#
# Two jobs, each reproducing one of the two `docker compose` services on a clean
# checkout. Nothing here is GitHub-specific logic: the same two commands are what
# a reviewer runs locally.
#
#   host   — compiler + runtime tests, then the JIT-Porting Court verifier
#            (committed-evidence court first, then the determinism court).
#   kernel — build the no_std Multiboot kernel, boot it in QEMU, verify the boot
#            evidence, and assert the boot evidence is byte-reproducible against
#            the committed evidence manifest.
#
# Both run on every push to `main` and every pull request against it, and can be
# dispatched manually. The kernel job builds and boots QEMU inside the container,
# so it is the slower of the two.

name: Phorensic OS CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host:
    name: host courts
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build host container
        run: docker compose build host

      - name: Run host tests and courts
        run: docker compose run --rm host

  kernel:
    name: kernel boot evidence
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build kernel container
        run: docker compose build kernel

      - name: Run kernel boot evidence court
        run: docker compose run --rm kernel
