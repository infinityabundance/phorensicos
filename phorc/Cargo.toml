[package]
name = "phorc"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "phorc"
path = "src/main.rs"

[dependencies]
object = { version = "0.36", features = ["write", "elf"] }
iced-x86 = { version = "1.21", default-features = false, features = ["std", "decoder", "encoder", "block_encoder", "op_code_info", "code_asm"] }
hex = "0.4.3"
sha2 = "0.11.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
